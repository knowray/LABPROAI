name: LabProAI VMI Refresh

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh-vmi:
    if: ${{ github.event.head_commit.message != 'Refresh VMI positioning' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted VMI positioning refresh
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              (
                  "LabProAI helps technical buyers translate an application into requirements, evaluate products against those requirements, surface evidence and uncertainty, involve a specialist when needed, and move the approved configuration into quoting, supply continuity and reusable institutional knowledge.",
                  "LabProAI helps technical buyers translate an application into requirements, evaluate products against those requirements, surface evidence and uncertainty, involve a specialist when needed, and move the approved configuration into quoting, recurring supply planning and VMI opportunities — while preserving the decision as reusable institutional knowledge."
              ),
              (
                  '<div class="feature"><div class="feature-icon">∞</div><h3>Supply continuity</h3><p>Connect the approved technical decision to BOM, quote, qualified alternatives, replenishment and eventual VMI opportunity.</p></div>',
                  '<div class="feature"><div class="feature-icon">∞</div><h3>Supply Planning &amp; VMI</h3><p>Turn an approved configuration into a recurring supply plan. Estimate usage, define reorder timing, preserve qualified alternatives and identify where Lab Pro VMI can reduce stockouts and manual purchasing.</p></div>'
              ),
              (
                  '<div class="arch-step"><div class="num">6</div><b>SUPPLY</b><small>Quote, BOM, alternatives, continuity, replenishment and VMI.</small></div>',
                  '<div class="arch-step"><div class="num">6</div><b>SUPPLY</b><small>Quote, BOM, recurring supply, replenishment &amp; VMI.</small></div>'
              ),
              (
                  '''<div class="right-card">
                <h4>Supply Continuity</h4>
                <p>✓ Preferred supply path identified</p>
                <p>✓ Qualified alternate defined</p>
                <p>✓ Supply risk can be surfaced before disruption</p>
                <p>✓ Recurring consumption / VMI opportunity detected</p>
              </div>''',
                  '''<div class="right-card">
                <h4>Supply Plan / VMI Opportunity</h4>
                <p><b>Recurring consumables detected</b></p>
                <p>Wipers — estimated 4 packs / month</p>
                <p>Gloves — estimated 2 cases / month</p>
                <p>✓ Supply confidence: High</p>
                <p>✓ Qualified alternates available</p>
                <p><b>VMI suitability: Good candidate</b></p>
                <button class="btn btn-soft" style="width:100%;margin-top:8px" onclick="alert('Demo action: Lab Pro VMI discussion initiated from the approved configuration.')">Discuss Lab Pro VMI →</button>
              </div>'''
              ),
              (
                  '<button class="btn btn-outline" onclick="alert(\'Demo action: supply planning workflow opened.\')">Create Supply Plan</button>',
                  '<button class="btn btn-outline" onclick="alert(\'Demo action: recurring usage, reorder planning and VMI suitability workflow opened.\')">Create Supply Plan</button>'
              ),
              (
                  '<p>ERP / inventory integration, consumption patterns, qualified alternate paths, reorder timing, VMI, supply-risk signals and eventually predictive replenishment.</p>',
                  '<p><b>Early workflow:</b> identify recurring requirements, estimate consumption, define supply plans and flag VMI suitability. <b>Later integration:</b> connect ERP / inventory, actual usage, reorder points, on-hand quantities, supply-risk signals and predictive replenishment.</p>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source text not found; stopping before partial update: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit refresh
        run: |
          git config user.name "LabProAI Demo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh VMI positioning"
          git push
